name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project MuseLocalMusic.xcodeproj

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project MuseLocalMusic.xcodeproj \
            -scheme MuseLocalMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MuseLocalMusic.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Muse-unsigned.ipa Payload
          ls -lh Muse-unsigned.ipa
          du -sh "$APP_PATH"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Muse-unsigned-IPA
          path: Muse-unsigned.ipa
          retention-days: 14
